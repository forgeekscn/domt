server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/domt?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:domt}
    password: ${MYSQL_PASSWORD:domt123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: DomtHikariPool
  sql:
    init:
      mode: always

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: cn.forgeeks.domt.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    cn.forgeeks.domt.mapper: debug
